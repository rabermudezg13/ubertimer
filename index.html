<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Uber Tracker"><link rel="manifest" href="./manifest.json"><title>Uber Wait Tracker</title><style>
:root{--bg:#0f1115;--card:#171a21;--card2:#20242d;--text:#f4f4f5;--muted:#a1a1aa;--accent:#22c55e;--danger:#ef4444;--border:#2d3340}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(circle at top,#1f2937 0%,var(--bg) 45%,#050505 100%);color:var(--text);padding:18px}.container{max-width:1120px;margin:auto}header{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}h1{font-size:clamp(2rem,6vw,3rem);line-height:1}.subtitle,.note{color:var(--muted);line-height:1.45}.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}button,select{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:12px;padding:11px 14px;font-size:.95rem;outline:none}select{width:100%;appearance:auto;-webkit-appearance:menulist}button{cursor:pointer;font-weight:750}.btn-primary{background:var(--accent);color:#03120a;border:none}.btn-secondary{background:#272b35}.btn-danger{background:rgba(239,68,68,.15);color:#fecaca;border-color:rgba(239,68,68,.35)}.summary{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.22);border-radius:18px;padding:14px;margin-bottom:18px;color:#dcfce7;line-height:1.5}.summary strong{color:#86efac}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.timer-card{background:linear-gradient(180deg,var(--card),#12141a);border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.25)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.timer-goodies-row{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#111827;padding:7px 10px;border-radius:999px;color:var(--muted);font-size:.8rem;margin-bottom:8px}.running-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}.running-dot.on{background:var(--accent);box-shadow:0 0 12px rgba(34,197,94,.9)}.time{font-size:2.6rem;font-weight:900;margin:10px 0 4px;font-variant-numeric:tabular-nums}.status{color:var(--muted);margin-bottom:12px;font-size:.94rem;line-height:1.45}.goodies-box{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:16px;padding:11px;max-height:360px;overflow:auto}.goodies-title{font-size:.8rem;color:var(--muted);margin-bottom:8px;font-weight:800;text-transform:uppercase}.goodie-count{display:grid;grid-template-columns:1fr 36px 34px 36px;gap:6px;align-items:center;padding:5px 0;font-size:.86rem}.mini-btn{padding:5px 0;border-radius:9px;font-weight:900}.count{text-align:center;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions .wide{grid-column:span 2}.empty{color:var(--muted);text-align:center;border:1px dashed var(--border);border-radius:18px;padding:30px;grid-column:1/-1}.install-box{display:none;margin-bottom:18px;padding:13px;border-radius:16px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#fde68a}.note{margin-top:18px;font-size:.86rem}@media(max-width:620px){.timer-goodies-row,.form-row{grid-template-columns:1fr}.time{font-size:2.45rem}}
</style></head><body><div class="container"><header><h1>Uber Wait Tracker</h1><p class="subtitle">Cronómetros por zona, ride type, goodies y promedio de espera del mismo día.</p><div class="top-actions"><button class="btn-primary" onclick="addTimer()">+ Agregar cronómetro</button><button class="btn-secondary" onclick="exportData()">Exportar CSV</button><button class="btn-danger" onclick="clearAll()">Borrar todo</button></div></header><section class="install-box" id="installBox">En iPhone: Safari → compartir → Add to Home Screen.</section><section class="summary" id="summaryBox"></section><main class="grid" id="timersGrid"></main><p class="note">El promedio de hoy usa los cronómetros creados hoy. Los goodies usan contadores para medir consumo real.</p></div><script>
const zones=["Aventura", "Bal Harbour", "Brickell", "Calle 8", "Coconut Grove", "Coral Gables", "Cruise Terminal", "Dadeland", "Design District", "Doral", "Downtown Miami", "Edgewater", "FLL Airport", "Fort Lauderdale", "Hallandale Beach", "Hard Rock / Hollywood", "Hollywood", "Key Biscayne", "Kendall", "Las Olas", "Little Havana", "MIA Airport", "Miami Beach", "Midtown", "North Miami", "Other", "Pinecrest", "PortMiami", "South Beach", "South Miami", "Sunny Isles", "Waterford District", "Wynwood"]; const goodies=["Tiny Water", "Fiji Water", "Sparkling Water", "Regular Coke", "Coke Zero", "Fanta", "Pistachios", "Welch's", "Cookies", "Candies", "Gums", "Wipes"]; const rideTypes=["Black", "Black SUV", "Premier", "XL"]; const STORAGE_KEY='uberTimersFinalV1'; let timers=JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function saveTimers(){localStorage.setItem(STORAGE_KEY,JSON.stringify(timers))}function formatTime(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function getElapsedSeconds(t){const base=t.elapsedBeforePause||0;if(!t.running||!t.startTimestamp)return base;return base+Math.floor((Date.now()-t.startTimestamp)/1000)}function emptyGoodies(){return Object.fromEntries(goodies.map(g=>[g,0]))}function normalize(t){return{...t,rideType:t.rideType||'Black',dateKey:t.dateKey||todayKey(),consumedGoodies:{...emptyGoodies(),...(t.consumedGoodies||{})}}}
function addTimer(){timers.unshift({id:Date.now(),zone:'MIA Airport',rideType:'Black',running:false,startTimestamp:null,elapsedBeforePause:0,createdAt:new Date().toLocaleString(),dateKey:todayKey(),lastPausedAt:null,consumedGoodies:emptyGoodies()});saveTimers();renderTimers()}function toggleTimer(id){timers=timers.map(r=>{const t=normalize(r);if(t.id!==id)return t;if(t.running)return{...t,running:false,elapsedBeforePause:getElapsedSeconds(t),startTimestamp:null,lastPausedAt:new Date().toLocaleString()};return{...t,running:true,startTimestamp:Date.now()}});saveTimers();renderTimers()}function resetTimer(id){timers=timers.map(r=>{const t=normalize(r);return t.id===id?{...t,running:false,startTimestamp:null,elapsedBeforePause:0,lastPausedAt:null,consumedGoodies:emptyGoodies()}:t});saveTimers();renderTimers()}function deleteTimer(id){timers=timers.filter(t=>t.id!==id);saveTimers();renderTimers()}function updateZone(id,zone){timers=timers.map(r=>{const t=normalize(r);return t.id===id?{...t,zone}:t});saveTimers();renderTimers()}function updateRideType(id,rideType){timers=timers.map(r=>{const t=normalize(r);return t.id===id?{...t,rideType}:t});saveTimers();renderTimers()}function changeGoodie(id,g,delta){timers=timers.map(r=>{const t=normalize(r);if(t.id!==id)return t;const n=Math.max(0,Number(t.consumedGoodies[g]||0)+delta);return{...t,consumedGoodies:{...t.consumedGoodies,[g]:n}}});saveTimers();updateLiveDisplay()}function clearAll(){if(!confirm('¿Seguro que quieres borrar todos los cronómetros?'))return;timers=[];saveTimers();renderTimers()}
function waitLabel(sec){const m=Math.floor(sec/60);if(m<10)return'Espera corta';if(m<25)return'Espera normal';if(m<45)return'Revisar zona';return'Posible zona lenta'}function goodiesSummary(t){const used=goodies.filter(g=>Number(t.consumedGoodies?.[g]||0)>0).map(g=>`${g} x${t.consumedGoodies[g]}`);return used.length?used.join(', '):'None'}function averageSeconds(list){if(!list.length)return 0;return Math.round(list.reduce((s,t)=>s+getElapsedSeconds(t),0)/list.length)}
function renderSummary(list){const box=document.getElementById('summaryBox');if(!timers.length){box.innerHTML='<strong>Tip:</strong> crea un cronómetro por cada zona donde estés esperando rides.';return}const today=todayKey();const todayTimers=timers.map(normalize).filter(t=>t.dateKey===today);const avg=averageSeconds(todayTimers);const running=timers.filter(t=>t.running).length;const longest=[...list].sort((a,b)=>b.currentElapsed-a.currentElapsed)[0];box.innerHTML=`<strong>${timers.length}</strong> cronómetro(s) · <strong>${running}</strong> corriendo<br>Promedio de espera de hoy: <strong>${formatTime(avg)}</strong> / ${todayTimers.length} registro(s)<br>Mayor espera: <strong>${longest.zone} / ${formatTime(longest.currentElapsed)}</strong>`}
function renderTimers(){const grid=document.getElementById('timersGrid');timers=timers.map(normalize);if(!timers.length){grid.innerHTML='<div class="empty">No tienes cronómetros activos. Agrega uno para empezar.</div>';renderSummary([]);saveTimers();return}const list=timers.map(t=>({...t,currentElapsed:getElapsedSeconds(t)}));renderSummary(list);grid.innerHTML=list.map(t=>`<article class="timer-card"><div class="form-row"><select onchange="updateZone(${t.id},this.value)">${zones.map(z=>`<option value="${z}" ${t.zone===z?'selected':''}>${z}</option>`).join('')}</select><select onchange="updateRideType(${t.id},this.value)">${rideTypes.map(r=>`<option value="${r}" ${t.rideType===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="timer-goodies-row"><div><div class="badge"><span class="running-dot ${t.running?'on':''}" data-dot-id="${t.id}"></span><span data-badge-id="${t.id}">${t.running?'Corriendo':'Pausado'} · ${t.zone} · ${t.rideType}</span></div><div class="time" data-time-id="${t.id}">${formatTime(t.currentElapsed)}</div><div class="status" data-status-id="${t.id}">${waitLabel(t.currentElapsed)}<br>Goodies: ${goodiesSummary(t)}<br>Creado: ${t.createdAt}${t.lastPausedAt?`<br>Última pausa: ${t.lastPausedAt}`:''}</div></div><div class="goodies-box"><div class="goodies-title">Goodies consumed</div>${goodies.map(g=>`<div class="goodie-count"><span>${g}</span><button class="mini-btn" onclick="changeGoodie(${t.id}, ${JSON.stringify(g)}, -1)">-</button><span class="count">${t.consumedGoodies[g]||0}</span><button class="mini-btn" onclick="changeGoodie(${t.id}, ${JSON.stringify(g)}, 1)">+</button></div>`).join('')}</div></div><div class="actions"><button class="${t.running?'btn-secondary':'btn-primary'}" onclick="toggleTimer(${t.id})">${t.running?'Pausar':'Iniciar'}</button><button class="btn-secondary" onclick="resetTimer(${t.id})">Reset</button><button class="btn-danger wide" onclick="deleteTimer(${t.id})">Borrar cronómetro</button></div></article>`).join('');saveTimers()}
function updateLiveDisplay(){if(!timers.length)return;timers=timers.map(normalize);const list=timers.map(t=>({...t,currentElapsed:getElapsedSeconds(t)}));list.forEach(t=>{const time=document.querySelector(`[data-time-id="${t.id}"]`),status=document.querySelector(`[data-status-id="${t.id}"]`),badge=document.querySelector(`[data-badge-id="${t.id}"]`),dot=document.querySelector(`[data-dot-id="${t.id}"]`);if(time)time.textContent=formatTime(t.currentElapsed);if(status)status.innerHTML=`${waitLabel(t.currentElapsed)}<br>Goodies: ${goodiesSummary(t)}<br>Creado: ${t.createdAt}${t.lastPausedAt?`<br>Última pausa: ${t.lastPausedAt}`:''}`;if(badge)badge.textContent=`${t.running?'Corriendo':'Pausado'} · ${t.zone} · ${t.rideType}`;if(dot)t.running?dot.classList.add('on'):dot.classList.remove('on')});renderSummary(list)}
function exportData(){if(!timers.length){alert('No hay datos para exportar.');return}timers=timers.map(normalize);const rows=[['Date','Zone','Ride Type','Wait Time','Seconds','Status','Running',...goodies,'Goodies Summary','Created At','Last Paused At'],...timers.map(t=>{const e=getElapsedSeconds(t);return[t.dateKey,t.zone,t.rideType,formatTime(e),e,waitLabel(e),t.running?'Yes':'No',...goodies.map(g=>t.consumedGoodies[g]||0),goodiesSummary(t),t.createdAt,t.lastPausedAt||'']})];const csv=rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('
');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='uber-wait-tracker.csv';a.click();URL.revokeObjectURL(url)}
function showInstallTip(){const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;if(isIOS&&!standalone)document.getElementById('installBox').style.display='block'}if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}if(!timers.length)addTimer();else renderTimers();showInstallTip();setInterval(updateLiveDisplay,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateLiveDisplay()});window.addEventListener('focus',updateLiveDisplay);
</script></body></html>
